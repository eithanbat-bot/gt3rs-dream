# LeadLift Mail requires a public OAuth callback on the same function URL.
# All POST actions validate the user's Supabase JWT server-side.
[functions.mail-assistant]
verify_jwt = false

[functions.register-leadlift-user]
verify_jwt = false

[auth]
site_url = "https://leadlift-gt3rs.vercel.app"
additional_redirect_urls = ["https://leadlift-gt3rs.vercel.app/assistant.html"]
