 const s=(await sdk.auth.getSession()).data.session;
 if(!s)throw Error("Please sign in");
 const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":PUBLIC_KEY,"Authorization":"Bearer "+s.access_token},body:JSON.stringify(body)});

}

 try{const d=await api({action:"status"});state.data=d;state.note="";render()}catch(e){state.note=e.message;render()}}

function stats(){const msgs=state.data.messages||[];const priority=msgs.filter(x=>x.intent_score>=70);return '<div class="stats">'+[
["Total messages",msgs.length,"Last synced messages"],

["Needs your decision",msgs.filter(x=>x.requires_human).length,"Approvals & handoffs"],

 (list.length?list.map(m=>'<button class="message '+(m.id===state.selected?"selected":"")+'" data-message="'+esc(m.id)+'"><span class="avatar">'+esc((m.sender_email||"?")[0].toUpperCase())+'</span><span><span class="msgsub">'+esc(m.subject)+'</span><span class="msgmeta">'+esc(m.sender_email)+' · '+formatDate(m.received_at)+'</span><span class="preview">'+esc(m.body_text)+'</span></span>'+badgeScore(m.intent_score)+'</button>').join(""):'<div class="empty">No messages in this view.<br>Connect a mailbox and sync to start.</div>')+
 '<div class="panelfoot">Scoring ranks purchase intent from 0–100. It is not a statistically calibrated purchase probability.</div></div><div class="panel">'+(selected?detail(selected):'<div class="empty">Select an email to inspect its score and suggested reply.</div>')+'</div></div>';
}

 return '<div class="detail"><div class="label">Email detail · '+esc(m.category)+'</div><h2>'+esc(m.subject)+'</h2><div class="meta">From '+esc(m.sender_email)+' · '+formatDate(m.received_at)+' · '+esc(m.status)+'</div>'+

 return '<div class="loginWrap"><div class="login"><div class="tag" style="width:max-content;margin-bottom:14px">Private workspace</div><h2>Sign in to LeadLift Mail</h2><p>Connect a mailbox only after you sign in. Your email data is separated from other businesses.</p>'+
 '<form id="authForm"><label class="label">Email</label><input id="email" type="email" autocomplete="username" required placeholder="you@company.com"><label class="label">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Your password"><button class="btn" type="submit">Sign in</button></form>'+
 '<div class="links"><button id="signupBtn">Create account</button><button id="magicBtn">Email me a sign-in link</button></div><div class="divider"></div><button class="btn secondary" id="tryDemo">Explore without connecting email</button><p class="notice">No inbox access is requested until you explicitly connect Gmail or Microsoft 365.</p></div></div>';
}
function render(){
 const pages={inbox:["Priority inbox","High-intent conversations, ranked and ready for action."],handoff:["Human handoffs","Bookings, sensitive decisions and exceptions."],voice:["Writing style","Learn from your sent mail, under your control."],settings:["Connections & controls","Secure OAuth mailboxes and automation safeguards."]};
 q("#pageTitle").textContent=pages[state.page][0];q("#subtitle").textContent=pages[state.page][1];
 q("#modeTag").textContent=isDemo()?"Simulated demo":state.session?"Private workspace":"Not signed in";
 q("#modeTag").className="tag "+(isDemo()?"amber":state.session?"":"gray");
 q("#demoSwitch").textContent=isDemo()?"Exit demo":"Use demo";
 q("#syncBtn").style.display=state.session&&!isDemo()&&(state.data.accounts||[]).length?"":"none";
 q("#logoutBtn").style.display=state.session&&!isDemo()?"":"none";
 document.querySelectorAll(".nav button[data-page]").forEach(x=>x.classList.toggle("active",x.dataset.page===state.page));
 let html=(!isDemo()&&!state.session)?loginPage():
 '<div class="banner"><strong>'+(isDemo()?"Demonstration records — no real email is connected.":"Approval-first email workspace.")+'</strong> '+(isDemo()?"All examples are fictional. Explore scoring and draft actions without connecting a mailbox.":"Inbox ranking is heuristic and must be validated. Every actual send requires approval.")+'</div>'+
 (state.page==="settings"?connectionPage():state.page==="voice"?voicePage():inbox());
 q("#content").innerHTML='<div id="globalNote" class="notice hidden"></div>'+html;
 if(state.note)showNote(state.note,true);
 hook();
}
function hook(){
 document.querySelectorAll("[data-page]").forEach(x=>x.onclick=()=>switchPage(x.dataset.page));
 document.querySelectorAll("[data-filter]").forEach(x=>x.onclick=()=>{state.filter=x.dataset.filter;state.selected=null;render()});
 document.querySelectorAll("[data-message]").forEach(x=>x.onclick=()=>{state.selected=x.dataset.message;render()});
 document.querySelectorAll("[data-act]").forEach(x=>x.onclick=()=>act(x.dataset.act));
 document.querySelectorAll("[data-connect]").forEach(x=>x.onclick=()=>connect(x.dataset.connect));
 document.querySelectorAll("[data-use-account]").forEach(x=>x.onclick=()=>sync(x.dataset.useAccount));
 document.querySelectorAll("[data-pause]").forEach(x=>x.onclick=()=>changeMode(x.dataset.pause));
 document.querySelectorAll("[data-disconnect]").forEach(x=>x.onclick=()=>disconnect(x.dataset.disconnect));
 document.querySelectorAll("[data-train]").forEach(x=>x.onclick=()=>train(x.dataset.train));
 document.querySelectorAll("[data-consent]").forEach(x=>x.onchange=()=>consent(x.dataset.consent,x.checked));
 const f=q("#authForm");if(f)f.onsubmit=async(e)=>{e.preventDefault();await auth("signin")};
 if(q("#signupBtn"))q("#signupBtn").onclick=()=>auth("signup");
 if(q("#magicBtn"))q("#magicBtn").onclick=()=>auth("magic");
 if(q("#tryDemo"))q("#tryDemo").onclick=()=>{state.demo=true;switchPage("inbox")};
}
async function auth(mode){
 if(!sdk){showNote("Authentication library failed to load",true);return}
 const email=q("#email")?.value.trim(),password=q("#password")?.value||"";
 if(!email){showNote("Enter your email",true);return}
 let result;
 if(mode==="signup"){if(!password){showNote("Enter a password",true);return}result=await sdk.auth.signUp({email,password,options:{emailRedirectTo:location.origin+"/assistant.html"}})}
 else if(mode==="magic")result=await sdk.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+"/assistant.html"}});
 else result=await sdk.auth.signInWithPassword({email,password});
 if(result.error)showNote(result.error.message,true);
 else if(result.data.session){state.session=result.data.session;await load()}
 else showNote("Check your email to complete authentication.");
}
async function exec(action,body,success){
 if(isDemo())return;
 try{const r=await api(Object.assign({action},body||{}));if(success)showNote(success);return r}catch(e){showNote(e.message,true);return null}
}
async function connect(provider){try{const r=await api({action:"connect",provider});if(r.url)window.location.assign(r.url)}catch(e){showNote(e.message,true)}}
async function sync(id){
 if(state.busy)return;state.busy=true;
 const ids=id?[id]:(state.data.accounts||[]).map(x=>x.id);
 try{let total=0;for(const account_id of ids){showNote("Syncing recent email…");const r=await api({action:"sync",account_id});total+=r.processed||0}await load();showNote("Mailbox sync complete: "+total+" messages processed.")}catch(e){showNote(e.message,true)}finally{state.busy=false}
}
async function changeMode(id){const a=state.data.accounts.find(x=>x.id===id);await exec(a.send_mode==="paused"?"resume":"pause",{account_id:id});await load()}
async function disconnect(id){if(!confirm("Disconnect this mailbox and delete ALL its stored messages and style profile?"))return;await exec("disconnect",{account_id:id});await load()}
async function consent(id,enabled){await exec("consent",{account_id:id,enabled});await load()}
async function train(id){
 if(state.training||!confirm("Read up to your last 500 sent emails to learn aggregate writing style? No training email bodies are kept in the style profile."))return;
 state.training=true;
 try{
  let processed=0;
  for(let i=0;i<22;i++){
   const r=await api({action:"train",account_id:id});
   processed+=r.processed||0;
   await load();showNote("Learning your style: "+r.total+" of 500 sent messages processed.");
   if(r.complete||r.total>=500||r.processed===0)break;
  }
  showNote("Style-learning run finished. "+processed+" sent emails examined in this run.");
 }catch(e){showNote(e.message,true)}
 finally{state.training=false}
}
async function act(kind){
 const m=(state.data.messages||[]).find(x=>x.id===state.selected);if(!m)return;
 const draft=q("#draftText")?.value||"";
 if(isDemo()){
  if(kind==="draft"){m.draft_reply="Hi,\n\nThank you for your message. I have noted the details and will confirm the next steps once the information is verified.\n\nKind regards";m.status="drafted"}
  if(kind==="save"){m.draft_reply=draft;m.status="review"}
  if(kind==="dismiss"){m.status="dismissed"}
  if(kind==="send"){showNote("Demo only: sending is disabled.",true);return}
  render();return;
 }
 const account_id=m.account_id,message_id=m.id;
 try{
  if(kind==="send"){
   if(!draft.trim()||!confirm("Send this EXACT message from your connected mailbox to "+m.sender_email+"? This action cannot be undone."))return;
   await api({action:"send",account_id,message_id,draft,confirm:true});
  }else if(kind==="save")await api({action:"save_draft",account_id,message_id,draft});
  else if(kind==="draft")await api({action:"draft",account_id,message_id});
  else if(kind==="dismiss")await api({action:"dismiss",account_id,message_id});
  await load();state.selected=message_id;render();showNote(kind==="send"?"Approved reply sent.":"Message updated.");
 }catch(e){showNote(e.message,true)}
}
q("#demoSwitch").onclick=async()=>{state.demo=!state.demo;state.selected=null;await load()};
q("#syncBtn").onclick=()=>sync();
q("#logoutBtn").onclick=async()=>{await sdk.auth.signOut();state.session=null;state.data={accounts:[],messages:[],profiles:[],readiness:{}};render()};
(async()=>{
 if(sdk){const r=await sdk.auth.getSession();state.session=r.data.session||null;sdk.auth.onAuthStateChange((_,session)=>{state.session=session||null})}
 if(new URLSearchParams(location.search).get("connection")){state.note="Mailbox connection: "+new URLSearchParams(location.search).get("connection");history.replaceState(null,"",location.pathname)}
 await load();
})();
})();
</script></body></html>
